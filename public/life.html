<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6b5b45">
  <title>LIFE · 生活娱乐</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%236b5b45'/><text y='.9em' x='50%' text-anchor='middle' font-size='60' fill='%23f7f3e9'>禅</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a1a;
      --accent: #6b5b45;
      --mist: rgba(255,255,255,0.85);
      --shadow: rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Serif SC', serif;
      background: linear-gradient(180deg, #f0e8d8 0%, #f7f3e9 100%);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: 0.2em;
    }
    .back {
      display: block;
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .back:hover { text-decoration: underline; }
    .card {
      background: var(--mist);
      border: 1px solid rgba(107,91,69,0.25);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 3px 14px var(--shadow);
      margin-bottom: 1.25rem;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    input[type="text"], input[type="url"], input[type="password"] {
      flex: 1;
      min-width: 140px;
      padding: 0.55rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    button {
      padding: 0.55rem 1.1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    button:hover { background: #5a4a38; }
    button.secondary { background: #8a7a65; }
    button.secondary:hover { background: #7a6a55; }
    button.danger {
      background: #a33;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }
    button.danger:hover { background: #822; }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px dashed rgba(107,91,69,0.2);
      gap: 0.5rem;
    }
    li:last-child { border-bottom: none; }
    li a {
      color: var(--ink);
      text-decoration: none;
      flex: 1;
      word-break: break-all;
    }
    li a:hover { color: var(--accent); text-decoration: underline; }
    .empty {
      text-align: center;
      color: #888;
      padding: 1.5rem;
      font-size: 0.95rem;
    }
    .hint {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.5rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    #lockOverlay {
      position: fixed;
      inset: 0;
      background: rgba(240,232,216,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    #lockOverlay.hidden { display: none; }
    .lock-box {
      background: var(--mist);
      border: 1px solid rgba(107,91,69,0.3);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }
    .lock-box h2 {
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }
    .lock-box p {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1.2rem;
    }
    .lock-box input {
      width: 100%;
      margin-bottom: 0.8rem;
      text-align: center;
      letter-spacing: 0.1em;
    }
    .lock-box .error {
      color: #a33;
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      min-height: 1.2em;
    }
    .main-content.hidden { display: none; }
      .lock-back { display:inline-block; margin-top:1rem; color:#4a6741; text-decoration:none; font-size:0.9rem; opacity:0.8; }
    .lock-back:hover { opacity:1; text-decoration:underline; }
  </style>
</head>
<body>
  <div id="lockOverlay">
    <div class="lock-box">
      <h2 id="lockTitle">LIFE · 解锁</h2>
      <p id="lockDesc">请输入密码以查看生活娱乐链接</p>
      <div class="error" id="lockError"></div>
      <input type="password" id="lockPwd" placeholder="输入密码" autocomplete="current-password">
      <input type="password" id="lockPwd2" placeholder="再次确认密码" style="display:none;" autocomplete="new-password">
      <button id="lockBtn" onclick="handleLockAction()" style="width:100%;margin-top:0.3rem;">解锁</button>
      <a href="index.html" class="lock-back">← 返回主页</a>
      <p class="hint" id="lockHint" style="margin-top:1rem;"></p>
    </div>
  </div>

  <div class="container main-content hidden" id="mainContent">
    <h1>LIFE · 生活娱乐</h1>
    <a href="index.html" class="back">← 返回首页</a>

    <div class="card">
      <div class="form-row">
        <input type="text" id="nameInput" placeholder="名称（如：B站 / 网易云）" maxlength="50">
        <input type="url" id="urlInput" placeholder="https://example.com" maxlength="300">
        <button onclick="addLink()">添加</button>
      </div>
      <div class="hint">链接已加密保存在本浏览器，点击即可新标签页打开。</div>
      <div class="toolbar">
        <button class="secondary" onclick="exportData()">导出</button>
        <button class="secondary" onclick="importData()">导入</button>
        <button class="secondary" onclick="changePassword()">修改密码</button>
        <button class="secondary" onclick="lockNow()">锁定</button>
        <button class="danger" onclick="clearAll()">清除全部</button>
      </div>
    </div>

    <div class="card">
      <ul id="linkList"></ul>
      <div class="empty" id="emptyTip">暂无链接，请在上方添加。</div>
    </div>
  </div>

  <script>
    // ========== 配置 ==========
    // 部署 Worker 后，把下面改成你的 Worker 地址
    // const WORKER_URL = 'https://zen-sync.你的账号.workers.dev';
    const WORKER_URL = 'https://m.1024m.bond';

    const PAGE = 'life';
    const HASH_KEY = `zen_${PAGE}_pwd_hash`;
    const DATA_KEY = `zen_${PAGE}_data`;
    const SESSION_KEY = `zen_${PAGE}_unlocked`;

    let currentPassword = null;
    let links = [];

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function deriveKey(password) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode('zen-dashboard-salt-v1'), iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encrypt(text, password) {
      const key = await deriveKey(password);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(text);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
      const combined = new Uint8Array(iv.length + cipher.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(cipher), iv.length);
      return btoa(String.fromCharCode(...combined));
    }

    async function decrypt(base64, password) {
      const key = await deriveKey(password);
      const combined = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const iv = combined.slice(0, 12);
      const data = combined.slice(12);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return new TextDecoder().decode(plain);
    }

    function setUnlocked(pwd) {
      currentPassword = pwd;
      sessionStorage.setItem(SESSION_KEY, '1');
    }

    function lockNow() {
      sessionStorage.removeItem(SESSION_KEY);
      currentPassword = null;
      location.reload();
    }

    async function hasPassword() {
      if (localStorage.getItem(HASH_KEY)) return true;
      if (WORKER_URL) {
        try {
          const res = await fetch(`${WORKER_URL}/api/${PAGE}`);
          const obj = await res.json();
          return !!(obj && obj.hash);
        } catch { return false; }
      }
      return false;
    }

    async function loadLinks() {
      if (!currentPassword) {
        links = [];
        return;
      }

      let raw = null;

      if (WORKER_URL) {
        try {
          const res = await fetch(`${WORKER_URL}/api/${PAGE}`);
          if (res.ok) {
            const obj = await res.json();
            if (obj.data) {
              raw = obj.data;
              localStorage.setItem(DATA_KEY, raw);
              if (obj.hash) localStorage.setItem(HASH_KEY, obj.hash);
            }
          }
        } catch (e) {
          console.warn('云端读取失败，使用本地缓存', e);
        }
      }

      if (!raw) raw = localStorage.getItem(DATA_KEY);

      if (!raw) {
        links = [];
        return;
      }

      try {
        const json = await decrypt(raw, currentPassword);
        links = JSON.parse(json);
      } catch {
        links = [];
        alert('数据解密失败，可能是密码错误或数据已损坏。');
      }
    }

    async function saveLinks() {
      if (!currentPassword) return;
      const json = JSON.stringify(links);
      const encrypted = await encrypt(json, currentPassword);
      const hash = await sha256(currentPassword);

      localStorage.setItem(DATA_KEY, encrypted);
      localStorage.setItem(HASH_KEY, hash);

      if (WORKER_URL) {
        try {
          await fetch(`${WORKER_URL}/api/${PAGE}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hash, data: encrypted }),
          });
        } catch (e) {
          console.warn('云端保存失败（本地已保存）', e);
        }
      }
    }

    function render() {
      const ul = document.getElementById('linkList');
      const empty = document.getElementById('emptyTip');
      ul.innerHTML = '';
      if (links.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      links.forEach((item, idx) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = item.name || item.url;
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = '删除';
        btn.onclick = async () => {
          if (confirm('确定删除「' + (item.name || item.url) + '」？')) {
            links.splice(idx, 1);
            await saveLinks();
            render();
          }
        };
        li.appendChild(a);
        li.appendChild(btn);
        ul.appendChild(li);
      });
    }

    async function addLink() {
      const name = document.getElementById('nameInput').value.trim();
      let url = document.getElementById('urlInput').value.trim();
      if (!url) { alert('请填写网址'); return; }
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      try { new URL(url); } catch { alert('网址格式不正确'); return; }
      links.push({ name: name || url, url });
      await saveLinks();
      document.getElementById('nameInput').value = '';
      document.getElementById('urlInput').value = '';
      render();
    }

    async function showLockUI() {
      const overlay = document.getElementById('lockOverlay');
      const title = document.getElementById('lockTitle');
      const desc = document.getElementById('lockDesc');
      const pwd2 = document.getElementById('lockPwd2');
      const btn = document.getElementById('lockBtn');
      const hint = document.getElementById('lockHint');
      const hasPwd = await hasPassword();

      if (!hasPwd) {
        title.textContent = 'LIFE · 设置密码';
        desc.textContent = '首次使用，请设置一个密码（用于加密保护链接）';
        pwd2.style.display = 'block';
        btn.textContent = '设置密码并进入';
        hint.textContent = '密码仅保存在本设备，请务必记住。';
      } else {
        title.textContent = 'LIFE · 解锁';
        desc.textContent = '请输入密码以查看生活娱乐链接';
        pwd2.style.display = 'none';
        btn.textContent = '解锁';
        hint.textContent = '新设备或新浏览器需要重新输入密码。';
      }
      overlay.classList.remove('hidden');
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('lockPwd').focus();
    }

    async function handleLockAction() {
      const pwd = document.getElementById('lockPwd').value;
      const pwd2 = document.getElementById('lockPwd2').value;
      const err = document.getElementById('lockError');
      err.textContent = '';

      if (!pwd || pwd.length < 4) {
        err.textContent = '密码至少 4 位';
        return;
      }

      const hasPwd = await hasPassword();

      if (!hasPwd) {
        if (pwd !== pwd2) {
          err.textContent = '两次密码不一致';
          return;
        }
        const hash = await sha256(pwd);
        localStorage.setItem(HASH_KEY, hash);
        setUnlocked(pwd);
        await loadLinks();
        document.getElementById('lockOverlay').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        render();
        return;
      }

      const stored = localStorage.getItem(HASH_KEY);
      const hash = await sha256(pwd);
      if (hash !== stored) {
        err.textContent = '密码错误';
        return;
      }
      setUnlocked(pwd);
      await loadLinks();
      document.getElementById('lockOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      render();
    }

    async function changePassword() {
      const oldPwd = prompt('请输入当前密码：');
      if (!oldPwd) return;
      const hash = await sha256(oldPwd);
      if (hash !== localStorage.getItem(HASH_KEY)) {
        alert('当前密码错误');
        return;
      }
      const newPwd = prompt('请输入新密码（至少4位）：');
      if (!newPwd || newPwd.length < 4) {
        alert('新密码无效');
        return;
      }
      const newPwd2 = prompt('请再次输入新密码：');
      if (newPwd !== newPwd2) {
        alert('两次新密码不一致');
        return;
      }
      currentPassword = oldPwd;
      await loadLinks();
      const newHash = await sha256(newPwd);
      localStorage.setItem(HASH_KEY, newHash);
      currentPassword = newPwd;
      await saveLinks();
      alert('密码已修改成功');
    }

    function exportData() {
      const data = localStorage.getItem(DATA_KEY);
      const hash = localStorage.getItem(HASH_KEY);
      if (!data) {
        alert('暂无数据可导出');
        return;
      }
      const payload = JSON.stringify({ page: PAGE, hash, data, version: 1 });
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `zen-${PAGE}-backup.json`;
      a.click();
      URL.revokeObjectURL(url);
      alert('已导出加密备份文件。请在其他设备使用「导入」功能，并使用相同密码解锁。');
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const obj = JSON.parse(text);
          if (!obj.data || !obj.hash) throw new Error('格式错误');
          if (!confirm('导入将覆盖当前本页数据，是否继续？')) return;
          localStorage.setItem(DATA_KEY, obj.data);
          localStorage.setItem(HASH_KEY, obj.hash);
          alert('导入成功！请使用原密码解锁。');
          location.reload();
        } catch (err) {
          alert('导入失败：' + err.message);
        }
      };
      input.click();
    }

    async function clearAll() {
      if (!confirm('确定清除本页所有链接和密码？此操作不可恢复。')) return;
      localStorage.removeItem(DATA_KEY);
      localStorage.removeItem(HASH_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    document.getElementById('lockPwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('lockPwd2').style.display !== 'none') {
          document.getElementById('lockPwd2').focus();
        } else {
          handleLockAction();
        }
      }
    });
    document.getElementById('lockPwd2').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLockAction();
    });
    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addLink();
    });
    document.getElementById('nameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('urlInput').focus();
    });

    showLockUI();
  </script>
</body>
</html>
