<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce">
<title>物联卡 · 流量卡查询</title>
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --ink:#1a1d21; --sub:#5b6472; --line:#e4e8ec;
    --accent:#0b63ce; --accent2:#e8f1fd;
    --ok:#1a7f4b; --warn:#b26a00; --bad:#c0392b;
    --ring:#0b63ce; --ringbg:#e9eef3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:14px 12px 34px;min-height:100vh;
  }
  .wrap{width:100%;max-width:460px;margin:0 auto}

  /* ---------- 卡号条 ---------- */
  .cardno{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:13px 16px;text-align:center;font-weight:700;font-size:16.5px;
    letter-spacing:.6px;margin-bottom:11px;word-break:break-all;
    display:flex;align-items:center;justify-content:center;gap:9px;
    flex-wrap:wrap;
  }
  .cardno .dot{width:7px;height:7px;border-radius:50%;background:#c9ced5;flex:0 0 auto}
  .cardno.live .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .cardno .copy{
    font-size:11.5px;font-weight:500;color:var(--sub);border:1px solid var(--line);
    background:#f7f8fa;border-radius:6px;padding:2px 7px;cursor:pointer;flex:0 0 auto;
  }
  .cardno .copy:active{background:#eceff2}

  /* ---------- 主卡片 ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px;margin-bottom:11px;
  }

  .flowhead{display:flex;justify-content:space-between;font-size:13.5px;color:var(--sub);margin-bottom:2px}
  .flowhead b{color:var(--ink);font-weight:600}

  .ringbox{display:flex;justify-content:center;padding:8px 0 2px}
  .ring{position:relative;width:186px;height:186px}
  .ring svg{transform:rotate(-90deg);display:block}
  .ring .mid{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  .ring .left-ttl{font-size:12.5px;color:var(--sub);margin-bottom:2px}
  .ring .left-val{font-size:25px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
  .ring .pct{font-size:12.5px;color:var(--sub);margin-top:4px}

  .upd{text-align:center;font-size:12px;color:var(--sub);margin-top:8px}

  /* ---------- 信息行 ---------- */
  .rows{display:flex;flex-direction:column;gap:11px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .row .k{color:var(--sub);font-size:13.5px;flex:0 0 auto}
  .row .v{font-weight:600;text-align:right;word-break:break-all}
  .row .v.big{font-size:16px}

  /* ---------- 天数 ---------- */
  .days{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
  .daycard{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:15px 16px;text-align:center}
  .daycard .lbl{font-size:13.5px;color:var(--sub);margin-bottom:3px}
  .daycard .num{font-size:31px;font-weight:700;letter-spacing:-1px;line-height:1.1}
  .daycard .sub2{font-size:12px;color:var(--sub);margin-top:5px}
  .daycard.used .num{color:var(--warn)}
  .daycard.avail .num{color:var(--ok)}

  /* ---------- 状态 ---------- */
  .state{
    display:flex;align-items:center;gap:8px;justify-content:center;
    font-size:13px;color:var(--sub);padding:4px 0 2px;
  }
  .state .badge{
    font-size:12px;font-weight:600;border-radius:99px;padding:3px 11px;
  }
  .badge.ok{background:#e8f6ee;color:var(--ok)}
  .badge.warn{background:#fdf3e3;color:var(--warn)}
  .badge.bad{background:#fdecea;color:var(--bad)}
  .badge.info{background:var(--accent2);color:var(--accent)}

  /* ---------- 刷新 ---------- */
  .toolbar{display:flex;gap:9px;margin-top:13px}
  .btn{
    flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:12px 10px;font-size:14.5px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.55;cursor:default}

  /* ---------- 骨架 / 提示 ---------- */
  .skeleton{border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 50%,#eceff2 75%);
    background-size:200% 100%;animation:sk 1.3s infinite;color:transparent!important}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .offline{
    background:#fdf3e3;border:1px solid #f0dcb8;color:#7a4f00;
    border-radius:11px;padding:12px 14px;font-size:13.5px;margin-bottom:11px;display:none;
  }
  .offline.show{display:block}
  .offline b{display:block;margin-bottom:3px}

  .back{display:block;text-align:center;margin:0 0 11px;color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:600;opacity:.85}
  .back:hover{opacity:1;text-decoration:underline}
  .foot{text-align:center;font-size:11.5px;color:#8b939c;margin-top:18px;line-height:1.7}

  /* 不显示任何模态框 —— 接口返回的公告以折叠区呈现 */
  details.notice{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:0;margin-bottom:11px;overflow:hidden;
  }
  details.notice>summary{
    padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--accent);
    cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;
  }
  details.notice>summary::-webkit-details-marker{display:none}
  details.notice>summary::after{content:"展开 ▾";font-size:12px;font-weight:400;color:var(--sub)}
  details.notice[open]>summary::after{content:"收起 ▴"}
  details.notice .nbody{
    padding:0 16px 15px;font-size:13.5px;color:var(--sub);line-height:1.75;
    border-top:1px solid var(--line);padding-top:13px;
  }
  details.notice .nbody p{margin:7px 0}
  details.notice .nbody strong{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

  <a href="index.html" class="back">← 返回首页</a>

  <!-- 卡号 -->
  <div class="cardno" id="cardno">
    <span class="dot"></span>
    <span id="cardnoText">加载中…</span>
    <span class="copy" id="copyBtn">复制</span>
  </div>

  <!-- 离线提示 -->
  <div class="offline" id="offline">
    <b>无法获取最新数据</b>
    接口暂时不可达或网络受限，当前显示的是最后一次成功获取的数据。
  </div>

  <!-- 流量主卡 -->
  <div class="card">
    <div class="flowhead">
      <span>已使用 <b id="usedTxt">—</b></span>
      <span>总流量 <b id="totalTxt">—</b></span>
    </div>

    <div class="ringbox">
      <div class="ring">
        <svg width="186" height="186" viewBox="0 0 186 186">
          <circle cx="93" cy="93" r="79" fill="none" stroke="var(--ringbg)" stroke-width="13"/>
          <circle id="ringArc" cx="93" cy="93" r="79" fill="none"
                  stroke="var(--ring)" stroke-width="13" stroke-linecap="round"
                  stroke-dasharray="496.4" stroke-dashoffset="496.4"
                  style="transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)"/>
        </svg>
        <div class="mid">
          <div class="left-ttl">剩余</div>
          <div class="left-val" id="leftTxt">—</div>
          <div class="pct" id="pctTxt">—</div>
        </div>      </div>
    </div>

    <div class="upd">最近更新：<span id="updTxt">—</span></div>
  </div>

  <!-- 套餐信息 -->
  <div class="card">
    <div class="rows">
      <div class="row"><span class="k">运营商</span><span class="v" id="opTxt">—</span></div>
      <div class="row"><span class="k">当前套餐</span><span class="v" id="planTxt">—</span></div>
      <div class="row"><span class="k">开通时间</span><span class="v" id="startTxt">—</span></div>
      <div class="row"><span class="k">到期时间</span><span class="v" id="endTxt">—</span></div>
      <div class="row"><span class="k">ICCID</span><span class="v" id="iccTxt" style="font-size:12.5px;font-weight:500;color:var(--sub)">—</span></div>
    </div>
  </div>

  <!-- 天数 -->
  <div class="days">
    <div class="daycard used">
      <div class="lbl">已用天数</div>
      <div class="num" id="usedDays">—</div>
      <div class="sub2">日均使用：<span id="avgUsed">—</span></div>
    </div>
    <div class="daycard avail">
      <div class="lbl">可用天数</div>
      <div class="num" id="availDays">—</div>
      <div class="sub2">日均可用：<span id="avgAvail">—</span></div>
    </div>
  </div>

  <!-- 状态 -->
  <div class="state">
    <span class="badge info" id="statusBadge">查询中…</span>
  </div>

  <!-- 公告（折叠，绝不弹窗） -->
  <details class="notice" id="noticeBox" style="display:none;margin-top:13px">
    <summary>套餐说明与注意事项</summary>
    <div class="nbody" id="noticeBody"></div>
  </details>

  <!-- 操作 -->
  <div class="toolbar">
    <button class="btn" id="refreshBtn">刷新</button>
    <button class="btn primary" id="autoBtn">自动刷新：关</button>
  </div>

  <div class="foot">
    数据来源：sdx.babm.cn 官方查询接口 · 页面实时拉取（直连失败自动走同域代理）<br>
    <span id="tsFoot">—</span>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ------- 配置 -------
  var DEFAULT_CARD = "21922D1291913";
  // 允许 ?card=21922D1291913 覆盖默认卡号
  var qs = (location.search.match(/[?&]card=([^&]+)/) || [])[1];
  var CARD = qs ? decodeURIComponent(qs) : DEFAULT_CARD;
  var DIRECT = "https://sdx.babm.cn/app/simCard/phoneSimCard?card=" + encodeURIComponent(CARD);
  // 直连失败时回退走同域 Worker 代理（避免 CORS / 运营商侧限制）
  var PROXY  = "api/sim?card=" + encodeURIComponent(CARD);
  var MB   = 1024;              // 接口单位 MB -> GB
  var AUTO_MS = 60000;          // 自动刷新间隔

  var autoTimer = null;
  var lastGood  = null;         // 最后一次成功的数据
  var lastTime  = null;

  var $ = function(id){ return document.getElementById(id); };

  // ------- 工具 -------
  function fmtGB(mb){
    if (mb === null || mb === undefined || isNaN(mb)) return "—";
    return (mb / MB).toFixed(2) + "GB";
  }
  function fmtDate(s){
    if (!s || typeof s !== "string") return "—";
    return s.replace(/-/g, "/").slice(0, 16);
  }
  function fmtTime(d){
    function p(n){ return (n<10?"0":"") + n; }
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function esc(s){
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  // 由「开通时间 / 到期时间」推算天数，与 APP 首页口径一致。
  // 口径（反推自 APP 截图，2026-09-29 21:56 显示 已用272 / 可用94）：
  //   总周期 = 到期 - 开通 = 365 天
  //   可用天数 = ceil((到期 - 现在) / 86400) = 94   ← 向上取整，注意不是 floor
  //   已用天数 = 总周期 - 可用天数 + 1 = 272       ← 含当天
  // 校验：94 = 接口 days 字段(93) + 1
  function computeDays(startStr, endStr){
    var s = Date.parse(String(startStr||"").replace(/-/g,"/"));
    var e = Date.parse(String(endStr||"").replace(/-/g,"/"));
    if (isNaN(s) || isNaN(e) || e <= s) return null;
    var DAY = 86400000;
    var total = Math.round((e - s) / DAY);              // 整个周期天数
    var avail = Math.ceil((e - Date.now()) / DAY);      // 剩余天数：向上取整
    if (avail < 0) avail = 0;
    if (avail > total) avail = total;
    var used = total - avail + 1;                       // 含当天
    if (used < 1) used = 1;
    if (used > total) used = total;
    return { total: total, used: used, avail: avail };
  }

  // ------- 渲染 -------
  function render(d, when){
    var totalMB   = d.sumFlow;
    var usedMB    = d.consumeFlow;
    var leftMB    = d.surplusFlow;
    var usedPct   = (totalMB > 0) ? (usedMB / totalMB * 100) : 0;   // 与 APP 首页一致：显示「已用」占比
    var leftPct   = (totalMB > 0) ? (leftMB / totalMB * 100) : 0;

    $("cardnoText").textContent = d.meCardNum || CARD;
    $("usedTxt").textContent    = fmtGB(usedMB);
    $("totalTxt").textContent   = fmtGB(totalMB);
    $("leftTxt").textContent    = fmtGB(leftMB);
    // APP 首页圆环中央显示的是「已用百分比」（截图 3.89%），此处对齐该口径
    $("pctTxt").textContent     = usedPct.toFixed(2) + "%（已用）";

    // 圆环：按剩余比例填充
    var C = 2 * Math.PI * 79;                 // 周长 ≈ 496.4
    var arc = $("ringArc");
    arc.setAttribute("stroke-dasharray", C.toFixed(1));
    arc.setAttribute("stroke-dashoffset", (C * (1 - leftPct/100)).toFixed(1));
    // 剩余偏少时变橙，起提示作用
    arc.setAttribute("stroke", leftPct < 10 ? "#e08a00" : "#0b63ce");

    $("opTxt").textContent    = d.name || d.falseOp || "—";
    $("planTxt").textContent  = d.displayName || "—";
    $("startTxt").textContent = fmtDate(d.addTime);
    $("endTxt").textContent   = fmtDate(d.mealEndTime);
    $("iccTxt").textContent   = d.iccId || "—";

    var dd = computeDays(d.addTime, d.mealEndTime);
    if (dd){
      $("usedDays").textContent  = dd.used;
      $("availDays").textContent = dd.avail;
      var avgU = dd.used  > 0 ? (usedMB / dd.used)  : 0;
      var avgA = dd.avail > 0 ? (leftMB / dd.avail) : 0;
      $("avgUsed").textContent  = (avgU/MB).toFixed(2) + "GB";
      $("avgAvail").textContent = (avgA/MB).toFixed(2) + "GB";
    } else {
      $("usedDays").textContent = $("availDays").textContent = "—";
      $("avgUsed").textContent  = $("avgAvail").textContent  = "—";
    }

    // 状态徽标
    var badge = $("statusBadge");
    var expired = dd ? (dd.avail <= 0) : false;
    if (!d.isPay || expired){
      badge.className = "badge bad";
      badge.textContent = expired ? "已到期" : "未激活";
    } else if (dd && dd.avail <= 7){
      badge.className = "badge warn";
      badge.textContent = "即将到期（剩 " + dd.avail + " 天）";
    } else if (leftPct < 10){
      badge.className = "badge warn";
      badge.textContent = "流量不足 10%";
    } else {
      badge.className = "badge ok";
      badge.textContent = "使用正常";
    }

    $("updTxt").textContent = fmtTime(when);
    $("tsFoot").textContent = "页面更新于 " + fmtTime(when);
    $("cardno").classList.add("live");
    $("offline").classList.remove("show");
  }

  function showOffline(){
    $("offline").classList.add("show");
    $("cardno").classList.remove("live");
  }

  // ------- 公告：只在展开时显示，绝不弹窗 -------
  function renderNotice(d){
    var parts = [];
    var sm = d.seriesModel || {};
    if (sm.alert)  parts.push(sm.alert);
    if (sm.notice) parts.push("<p>" + esc(sm.notice) + "</p>");
    var mo = d.mnnouncementModel || {};
    if (mo.content) parts.push("<p>" + esc(mo.content) + "</p>");
    if (d.prestoreTips) parts.push("<p>" + esc(d.prestoreTips) + "</p>");

    if (!parts.length){ $("noticeBox").style.display = "none"; return; }
    $("noticeBody").innerHTML = parts.join("");
    $("noticeBox").style.display = "";
  }

  // ------- 拉取 -------
  function load(silent){
    if (!silent) $("refreshBtn").disabled = true;
    $("refreshBtn").textContent = "刷新中…";

    function getJSON(u){
      return fetch(u, { method:"GET", cache:"no-store", credentials:"omit" })
        .then(function(r){
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        });
    }

    getJSON(DIRECT)
      .catch(function(){ return getJSON(PROXY); })   // 直连不通 → 走 Worker 代理
      .then(function(j){
        if (!j || j.code !== 0 || !j.data) {
          throw new Error(j && j.msg ? j.msg : "接口返回异常");
        }
        lastGood = j.data;
        lastTime = new Date();
        render(lastGood, lastTime);
        renderNotice(lastGood);
      })
      .catch(function(err){
        if (lastGood){
          render(lastGood, lastTime);   // 回退到上次成功的数据
          showOffline();
          $("statusBadge").className = "badge warn";
          $("statusBadge").textContent = "数据可能已过期";
        } else {
          $("statusBadge").className = "badge bad";
          $("statusBadge").textContent = "获取失败：" + (err && err.message ? err.message : "网络错误");
          showOffline();
        }
      })
      .then(function(){
        $("refreshBtn").disabled = false;
        $("refreshBtn").textContent = "刷新";
      });
  }

  // ------- 交互 -------
  $("refreshBtn").addEventListener("click", function(){ load(false); });

  $("autoBtn").addEventListener("click", function(){
    if (autoTimer){
      clearInterval(autoTimer); autoTimer = null;
      this.textContent = "自动刷新：关";
      this.classList.remove("primary");
    } else {
      autoTimer = setInterval(function(){ load(true); }, AUTO_MS);
      this.textContent = "自动刷新：开";
      this.classList.add("primary");
      load(true);
    }
  });

  $("copyBtn").addEventListener("click", function(){
    var t = $("cardnoText").textContent;
    var btn = this;
    var done = function(){ btn.textContent = "已复制"; setTimeout(function(){ btn.textContent = "复制"; }, 1300); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done, function(){ done(); });
    } else {
      var ta = document.createElement("textarea");
      ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta); done();
    }
  });

  // 页面回到前台时顺带刷新一次
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && lastGood) load(true);
  });

  // ------- 启动 -------
  $("cardnoText").textContent = CARD;
  load(false);
})();
</script>
</body>
</html>
